<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">ET AI Hackathon workflow</title><desc id="desc">The repository currently contains a Next.js frontend under frontend/. This diagram describes the current development path, not a verified hackathon feature flow.</desc><rect width="1200" height="400" rx="18" fill="#F4F1E9"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#4E756C">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2D2B27">ET AI Hackathon</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#77736B">Current repository layout and frontend run path</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#DDD7C9"/><path d="M 300 237 L 330 237" stroke="#77736B" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#77736B" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#77736B" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#77736B" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#77736B" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#77736B" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFDFA" stroke="#DDD7C9" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#4E756C"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4E756C">01 / REPOSITORY</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2D2B27">ET-AI-HACKATHON</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#77736B">Start at the repository root.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFDFA" stroke="#DDD7C9" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#B98545"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#B98545">02 / FRONTEND</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2D2B27">Next.js app</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#77736B">Enter the frontend directory.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFDFA" stroke="#DDD7C9" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#8A8A7C"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#8A8A7C">03 / INSTALL</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2D2B27">npm install</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#77736B">Install package dependencies.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFDFA" stroke="#DDD7C9" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#4E756C"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4E756C">04 / DEVELOP</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2D2B27">npm run dev</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#77736B">Open the local app at port 3000.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#4E756C">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#77736B">The current contents look like a Next.js starter; document hackathon features after verifying them.</text></svg>